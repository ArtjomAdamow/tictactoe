# fly.toml app configuration file generated for tictactoe-fennel-kernels on 2026-11-27T15:31:39+01:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'tictactoe-fennel-kernels'
primary_region = 'fra'

[build]

[env]
  SIM_STORE = '/data/simulations.json'

[mounts]
  source = 'simdata'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
